[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false
description = "Workspace automation (precommit, version bump/verify, LSP build)"
license.workspace = true

[dependencies]
semver = "1"
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
toml_edit = "0.25"

[dev-dependencies]
lemma-lsp = { version = "=0.11.3", path = "../engine/lsp" }

[[bin]]
name = "xtask"
path = "src/main.rs"

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemma Playground</title>
    <script src="vendor/vs/loader.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            color: #333;
        }

        #editor {
            width: 100%;
            height: 400px;
        }

        .editor-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
        }

        .editor-actions .hint {
            margin-top: 0;
        }

        .editor-actions .format-link {
            color: #666;
            font-size: 13px;
            text-decoration: none;
        }

        .editor-actions .format-link:hover {
            text-decoration: underline;
        }

        .hint {
            margin-top: 8px;
            color: #666;
            font-size: 13px;
        }

        /* --- Editor + status bar (IDE-style) --- */

        .editor-wrap {
            border: 1px solid #ccc;
            border-radius: 3px;
            overflow: hidden;
        }

        .editor-wrap #editor {
            border: none;
            border-radius: 0;
        }

        #status {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 22px;
            padding: 2px 10px;
            border-top: 1px solid #ddd;
            background: #f4f4f4;
            font-size: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: #333;
        }

        #status.ok {
            background: #f4f4f4;
            border-top-color: #e8e8e8;
        }

        #status.err {
            background: #f8d7da;
            border-top-color: #dc3545;
            color: #721c24;
        }

        #status.warn {
            background: #fff3cd;
            border-top-color: #ffc107;
            color: #856404;
        }

        #status .status-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Page cards --- */

        .spec-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
        }

        .spec-card h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        #spec-select {
            font-size: 14px;
            padding: 6px 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        /* --- Data input rows --- */

        .data-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .data-row {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 10px;
            align-items: center;
        }

        .data-row .label {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            color: #111;
        }

        .data-row .label .required {
            color: #dc3545;
            font-weight: 700;
            margin-left: 6px;
        }

        .data-row .input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .data-row select,
        .data-row input {
            width: 100%;
        }

        .data-row input[type="checkbox"] {
            width: auto;
            transform: translateY(1px);
        }

        .data-help {
            grid-column: 2 / 3;
            color: #666;
            font-size: 12px;
            margin-top: -6px;
        }

        /* --- Actions row --- */

        .spec-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 10px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
            margin: 0;
        }

        button:hover {
            background: #0056b3;
        }

        button.secondary {
            background: #6c757d;
        }

        button.secondary:hover {
            background: #5a6268;
        }

        /* --- Results table --- */

        .results-table {
            margin-top: 10px;
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .results-table th {
            background: #f0f0f0;
            padding: 10px;
            text-align: left;
            border-bottom: 2px solid #ddd;
        }

        .results-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
        }

        .results-table .rule-name {
            font-weight: 500;
            color: #007bff;
        }

        .results-table .value {
            font-family: monospace;
        }

        .results-table .veto {
            color: #dc3545;
            font-style: italic;
        }

        .result-message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 3px;
            white-space: pre-wrap;
            font-family: monospace;
        }

        .result-message.error {
            background: #f8d7da;
            border: 1px solid #dc3545;
        }

        .result-message.success {
            background: #d4edda;
            border: 1px solid #28a745;
        }

        /* --- Responsive --- */

        @media (max-width: 740px) {
            .data-row {
                grid-template-columns: 1fr;
            }

            .data-help {
                grid-column: 1 / 2;
                margin-top: -2px;
            }
        }
    </style>
</head>

<body>
    <h1>Lemma Playground</h1>

    <div class="section">
        <div class="editor-wrap">
            <div id="editor"></div>
            <div id="status" class="warn">
                <span class="status-text">Initializing…</span>
            </div>
        </div>
        <div class="editor-actions">
            <span class="hint">Edits auto-load.</span>
            <a href="#" id="format-btn" class="format-link" title="Format spec">Format</a>
        </div>
    </div>

    <div class="section">
        <div style="display:flex;align-items:center;justify-content:space-between;">
            <h2 style="margin:0;">Specs</h2>
            <select id="spec-select">
                <option value="">No specs loaded</option>
            </select>
        </div>
        <div id="spec-detail"></div>
    </div>

    <script type="module">
        import { init, Engine } from '../dist/lemma.js';
        import { registerLemmaLanguage, registerLspProviders } from '../dist/monaco.js';
        import { LspClient } from '../dist/lsp-client.js';

        // ---------------------------------------------------------------
        // State
        // ---------------------------------------------------------------

        let engine = null;
        let monacoEditor = null;
        let editorReady = false;
        let loadTimer = null;
        let lspClient = null;
        let lspVersion = 0;
        const DOC_URI = 'file:///playground/playground.lemma';

        const state = {
            specs: [],
            shows: {},
            dataValues: {},
            evalResults: {},
        };

        function datetimeValueToString(dt) {
            if (typeof dt !== 'string') {
                throw new Error('BUG: DateTimeValue serializes as a string, got ' + JSON.stringify(dt));
            }
            return dt;
        }

        function effectiveFromToShowParam(effective_from) {
            if (!effective_from || typeof effective_from !== 'object') return null;
            if (Object.prototype.hasOwnProperty.call(effective_from, 'Origin')) return null;
            if (effective_from.DateTimeValue) {
                return datetimeValueToString(effective_from.DateTimeValue);
            }
            return null;
        }

        function specKey(entry) {
            var repo = entry.repository != null && entry.repository !== '' ? entry.repository : '';
            var base = repo ? repo + '::' + entry.name : entry.name;
            var ef = entry.effective_from;
            if (!ef || typeof ef !== 'object') return base;
            if (Object.prototype.hasOwnProperty.call(ef, 'Origin')) return base;
            if (ef.DateTimeValue) {
                return base + ' ' + datetimeValueToString(ef.DateTimeValue);
            }
            return base;
        }

        function specEffective(key) {
            var entry = state.specs.find(function (d) { return specKey(d) === key; });
            if (!entry) return null;
            return effectiveFromToShowParam(entry.effective_from);
        }

        function dataValuesStorageKey(specName) {
            return 'lemma_playground:spec:' + specName;
        }

        function persistDataValues(specName) {
            try {
                localStorage.setItem(dataValuesStorageKey(specName), JSON.stringify(state.dataValues[specName] || {}));
            } catch (_) { }
        }

        function loadDataValuesFromStorage(specName) {
            if (state.dataValues[specName] && Object.keys(state.dataValues[specName]).length > 0) return;
            try {
                const raw = localStorage.getItem(dataValuesStorageKey(specName));
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && typeof parsed === 'object') {
                        state.dataValues[specName] = parsed;
                    }
                }
            } catch (_) { }
            if (!state.dataValues[specName]) state.dataValues[specName] = {};
        }

        // ---------------------------------------------------------------
        // Status panel
        // ---------------------------------------------------------------

        function setStatus(kind, title, message) {
            const element = document.getElementById('status');
            element.classList.remove('ok', 'err', 'warn');
            if (kind === 'ok') element.classList.add('ok');
            else if (kind === 'err') element.classList.add('err');
            else element.classList.add('warn');
            const text = message ? title + ': ' + message : (title || '');
            element.querySelector('.status-text').textContent = text;
            element.title = text;
        }

        // ---------------------------------------------------------------
        // Show introspection
        // ---------------------------------------------------------------

        function specKind(entryType) {
            return (entryType && typeof entryType.kind === 'string') ? entryType.kind : null;
        }

        function storedFromLiteralValue(lit, kind) {
            if (!lit || typeof lit !== 'object' || !lit.value) return undefined;
            const v = lit.value;
            const display = typeof lit.display_value === 'string' ? lit.display_value : '';
            if (kind === 'boolean') return v.boolean === true;
            if (kind === 'number') return v.number != null ? String(v.number) : display;
            if (kind === 'text') return typeof v.text === 'string' ? v.text : display;
            if (kind === 'measure') {
                if (display) {
                    const parts = display.trim().split(/\s+/);
                    if (parts.length >= 2) {
                        return { amount: parts[0], unit: parts.slice(1).join(' ') };
                    }
                    if (parts.length === 1) return { amount: parts[0], unit: '' };
                }
                if (v.measure && typeof v.measure === 'object' && Array.isArray(v.measure.signature)) {
                    const sig = v.measure.signature;
                    const value = String(v.measure.value ?? '');
                    if (sig.length === 1 && Array.isArray(sig[0]) && sig[0].length === 2 && sig[0][1] === 1) {
                        return { amount: value, unit: String(sig[0][0]) };
                    }
                }
            }
            if (kind === 'ratio') {
                if (Array.isArray(v.ratio)) return { amount: String(v.ratio[0] ?? ''), unit: (v.ratio[1] != null ? String(v.ratio[1]) : 'ratio') };
                return { amount: display, unit: 'ratio' };
            }
            if (kind === 'date' || kind === 'time' || kind === 'duration') return display;
            return display;
        }

        // ---------------------------------------------------------------
        // Data value serialization (state -> engine JSON)
        // ---------------------------------------------------------------

        function serializeDataValues(specName) {
            const values = state.dataValues[specName];
            if (!values) return {};

            const show = state.shows[specName];
            if (!show || !show.data || typeof show.data !== 'object' || Array.isArray(show.data)) {
                return {};
            }

            const result = {};

            for (const [name, data] of Object.entries(show.data)) {
                const entry = values[name];
                if (entry === undefined || entry === null) continue;

                const kind = specKind(data.entryType);

                if (kind === 'boolean') {
                    result[name] = entry === true;
                    continue;
                }

                if (kind === 'measure') {
                    if (typeof entry === 'object' && entry !== null) {
                        const amount = (entry.amount || '').toString().trim();
                        const unit = (entry.unit || '').toString().trim();
                        if (amount === '') continue;
                        if (unit !== '') {
                            result[name] = amount + ' ' + unit;
                        } else {
                            result[name] = Number(amount);
                        }
                    }
                    continue;
                }

                if (kind === 'ratio') {
                    if (typeof entry === 'object' && entry !== null) {
                        const amount = (entry.amount || '').toString().trim();
                        const unit = (entry.unit || '').toString().trim();
                        if (amount === '') continue;
                        if (unit === 'percent') {
                            result[name] = amount + '%';
                        } else if (unit === 'permille') {
                            result[name] = amount + '%%';
                        } else {
                            result[name] = Number(amount);
                        }
                    }
                    continue;
                }

                if (kind === 'number') {
                    const stringValue = entry.toString().trim();
                    if (stringValue === '') continue;
                    result[name] = Number(stringValue);
                    continue;
                }

                const stringValue = entry.toString().trim();
                if (stringValue !== '') {
                    result[name] = stringValue;
                }
            }

            return result;
        }

        // ---------------------------------------------------------------
        // DOM: Build a data input row
        // ---------------------------------------------------------------

        function buildDataRow(specName, name, data) {
            const entryType = data.entryType;
            const kind = specKind(entryType);
            // Kind-specific fields now live directly on the type object
            // (`minimum`, `maximum`, `units`, `options`, `help`, ...).
            const spec = entryType;

            const row = document.createElement('div');
            row.className = 'data-row';
            row.dataset.dataName = name;
            row.dataset.typeKind = kind || 'unknown';

            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = name;
            row.appendChild(label);

            const inputGroup = document.createElement('div');
            inputGroup.className = 'input-group';

            if (!state.dataValues[specName]) {
                state.dataValues[specName] = {};
            }
            let currentValue = state.dataValues[specName][name];
            if (currentValue === undefined && data.defaultValue) {
                const fromPage = storedFromLiteralValue(data.defaultValue, kind);
                if (fromPage !== undefined) {
                    state.dataValues[specName][name] = fromPage;
                    currentValue = fromPage;
                    persistDataValues(specName);
                }
            }

            if (kind === 'boolean') {
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                if (currentValue === true) {
                    checkbox.checked = true;
                }
                checkbox.addEventListener('change', function () {
                    state.dataValues[specName][name] = this.checked;
                    persistDataValues(specName);
                });
                inputGroup.appendChild(checkbox);

            } else if (kind === 'text') {
                const options = (spec && Array.isArray(spec.options)) ? spec.options : [];

                if (options.length > 0) {
                    const select = document.createElement('select');
                    const emptyOption = document.createElement('option');
                    emptyOption.value = '';
                    emptyOption.textContent = '';
                    select.appendChild(emptyOption);
                    for (const optionValue of options) {
                        const option = document.createElement('option');
                        option.value = optionValue;
                        option.textContent = optionValue;
                        select.appendChild(option);
                    }
                    if (typeof currentValue === 'string') {
                        select.value = currentValue;
                    }
                    select.addEventListener('change', function () {
                        state.dataValues[specName][name] = this.value;
                        persistDataValues(specName);
                    });
                    inputGroup.appendChild(select);
                } else {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.placeholder = 'text';
                    if (typeof currentValue === 'string') {
                        input.value = currentValue;
                    }
                    input.addEventListener('input', function () {
                        state.dataValues[specName][name] = this.value;
                        persistDataValues(specName);
                    });
                    inputGroup.appendChild(input);
                }

            } else if (kind === 'number') {
                const input = document.createElement('input');
                input.type = 'number';
                input.step = 'any';
                input.placeholder = 'number';
                if (currentValue !== undefined && currentValue !== null) {
                    input.value = currentValue.toString();
                }
                input.addEventListener('input', function () {
                    state.dataValues[specName][name] = this.value;
                    persistDataValues(specName);
                });
                inputGroup.appendChild(input);

            } else if (kind === 'measure') {
                const units = (spec && Array.isArray(spec.units)) ? spec.units : [];
                const storedEntry = (typeof currentValue === 'object' && currentValue !== null) ? currentValue : {};

                const amountInput = document.createElement('input');
                amountInput.type = 'number';
                amountInput.step = 'any';
                amountInput.placeholder = units.length > 0 ? 'amount' : 'number';
                if (storedEntry.amount !== undefined) {
                    amountInput.value = storedEntry.amount;
                }

                if (!state.dataValues[specName][name] || typeof state.dataValues[specName][name] !== 'object') {
                    state.dataValues[specName][name] = { amount: storedEntry.amount || '', unit: storedEntry.unit || '' };
                }

                amountInput.addEventListener('input', function () {
                    if (!state.dataValues[specName][name] || typeof state.dataValues[specName][name] !== 'object') {
                        state.dataValues[specName][name] = { amount: '', unit: '' };
                    }
                    state.dataValues[specName][name].amount = this.value;
                    persistDataValues(specName);
                });
                inputGroup.appendChild(amountInput);

                if (units.length > 0) {
                    const unitSelect = document.createElement('select');
                    for (const unitDefinition of units) {
                        const option = document.createElement('option');
                        option.value = unitDefinition.name;
                        option.textContent = unitDefinition.name;
                        unitSelect.appendChild(option);
                    }
                    const defaultUnit = storedEntry.unit && units.some(function (u) { return u.name === storedEntry.unit; })
                        ? storedEntry.unit
                        : units[0].name;
                    unitSelect.value = defaultUnit;
                    state.dataValues[specName][name].unit = defaultUnit;
                    unitSelect.addEventListener('change', function () {
                        state.dataValues[specName][name].unit = this.value;
                        persistDataValues(specName);
                    });
                    inputGroup.appendChild(unitSelect);
                }

            } else if (kind === 'ratio') {
                const units = (spec && Array.isArray(spec.units)) ? spec.units : [];
                const storedEntry = (typeof currentValue === 'object' && currentValue !== null) ? currentValue : {};

                const amountInput = document.createElement('input');
                amountInput.type = 'number';
                amountInput.step = 'any';
                amountInput.placeholder = 'amount';
                if (storedEntry.amount !== undefined) {
                    amountInput.value = storedEntry.amount;
                }

                if (!state.dataValues[specName][name] || typeof state.dataValues[specName][name] !== 'object') {
                    state.dataValues[specName][name] = { amount: storedEntry.amount || '', unit: storedEntry.unit || 'ratio' };
                }

                amountInput.addEventListener('input', function () {
                    if (!state.dataValues[specName][name] || typeof state.dataValues[specName][name] !== 'object') {
                        state.dataValues[specName][name] = { amount: '', unit: 'ratio' };
                    }
                    state.dataValues[specName][name].amount = this.value;
                    persistDataValues(specName);
                });
                inputGroup.appendChild(amountInput);

                const unitSelect = document.createElement('select');
                const ratioOption = document.createElement('option');
                ratioOption.value = 'ratio';
                ratioOption.textContent = 'ratio';
                unitSelect.appendChild(ratioOption);
                for (const unitDefinition of units) {
                    const option = document.createElement('option');
                    option.value = unitDefinition.name;
                    option.textContent = unitDefinition.name === 'percent' ? '%' : unitDefinition.name;
                    unitSelect.appendChild(option);
                }
                if (storedEntry.unit) {
                    unitSelect.value = storedEntry.unit;
                }
                unitSelect.addEventListener('change', function () {
                    state.dataValues[specName][name].unit = this.value;
                    persistDataValues(specName);
                });
                inputGroup.appendChild(unitSelect);

            } else if (kind === 'date') {
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = 'YYYY-MM-DD';
                if (typeof currentValue === 'string') {
                    input.value = currentValue;
                }
                input.addEventListener('input', function () {
                    state.dataValues[specName][name] = this.value;
                    persistDataValues(specName);
                });
                inputGroup.appendChild(input);

            } else if (kind === 'time') {
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = 'HH:MM[:SS]';
                if (typeof currentValue === 'string') {
                    input.value = currentValue;
                }
                input.addEventListener('input', function () {
                    state.dataValues[specName][name] = this.value;
                    persistDataValues(specName);
                });
                inputGroup.appendChild(input);

            } else if (kind === 'duration') {
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = 'e.g. 5 days';
                if (typeof currentValue === 'string') {
                    input.value = currentValue;
                }
                input.addEventListener('input', function () {
                    state.dataValues[specName][name] = this.value;
                    persistDataValues(specName);
                });
                inputGroup.appendChild(input);

            } else {
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = 'value';
                if (typeof currentValue === 'string') {
                    input.value = currentValue;
                }
                input.addEventListener('input', function () {
                    state.dataValues[specName][name] = this.value;
                    persistDataValues(specName);
                });
                inputGroup.appendChild(input);
            }

            row.appendChild(inputGroup);

            const helpText = (spec && typeof spec.help === 'string' && spec.help.trim() !== '') ? spec.help.trim() : null;
            if (helpText !== null) {
                const helpElement = document.createElement('div');
                helpElement.className = 'data-help';
                helpElement.textContent = helpText;
                row.appendChild(helpElement);
            }

            return row;
        }

        // ---------------------------------------------------------------
        // DOM: Build a results table from evaluation response
        // ---------------------------------------------------------------

        function buildResultsTable(response) {
            const rules = (response && response.results) ? response.results : {};
            const ruleNames = Object.keys(rules);

            if (ruleNames.length === 0) return null;

            const table = document.createElement('table');
            table.className = 'results-table';

            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            const headerRule = document.createElement('th');
            headerRule.textContent = 'Rule';
            const headerResult = document.createElement('th');
            headerResult.textContent = 'Result';
            const headerDetails = document.createElement('th');
            headerDetails.textContent = 'Details';
            headerRow.appendChild(headerRule);
            headerRow.appendChild(headerResult);
            headerRow.appendChild(headerDetails);
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');

            for (const ruleName of ruleNames) {
                const ruleData = rules[ruleName];

                const tableRow = document.createElement('tr');

                const nameCell = document.createElement('td');
                nameCell.className = 'rule-name';
                nameCell.textContent = ruleName;
                tableRow.appendChild(nameCell);

                const valueCell = document.createElement('td');
                const detailsCell = document.createElement('td');

                if (ruleData && ruleData.vetoed) {
                    valueCell.className = 'veto';
                    valueCell.textContent = 'Vetoed';
                    detailsCell.className = 'veto';
                    detailsCell.textContent = ruleData.veto_reason || 'Vetoed';
                } else if (ruleData && typeof ruleData.display === 'string' && ruleData.display.length > 0) {
                    valueCell.className = 'value';
                    valueCell.textContent = ruleData.display;
                    detailsCell.style.color = '#28a745';
                    detailsCell.textContent = 'Computed (' + (ruleData.rule_type || 'unknown') + ')';
                } else {
                    valueCell.textContent = '-';
                    detailsCell.textContent = 'No result';
                }

                tableRow.appendChild(valueCell);
                tableRow.appendChild(detailsCell);
                tbody.appendChild(tableRow);
            }

            table.appendChild(tbody);
            return table;
        }

        // ---------------------------------------------------------------
        // DOM: Build a spec card
        // ---------------------------------------------------------------

        function buildPageCard(key) {
            loadDataValuesFromStorage(key);
            const show = state.shows[key];
            const data =
                show && show.data && typeof show.data === 'object' && !Array.isArray(show.data)
                    ? show.data
                    : {};

            const card = document.createElement('div');
            card.className = 'spec-card';
            card.dataset.specName = key;

            const heading = document.createElement('h3');
            heading.textContent = 'spec ' + key;
            card.appendChild(heading);

            const dataGrid = document.createElement('div');
            dataGrid.className = 'data-grid';
            for (const [name, entry] of Object.entries(data)) {
                dataGrid.appendChild(buildDataRow(key, name, entry));
            }
            card.appendChild(dataGrid);

            const actions = document.createElement('div');
            actions.className = 'spec-actions';

            const runButton = document.createElement('button');
            runButton.textContent = 'Evaluate';
            runButton.addEventListener('click', function () {
                evaluatePage(key);
            });
            actions.appendChild(runButton);

            const clearButton = document.createElement('button');
            clearButton.className = 'secondary';
            clearButton.textContent = 'Clear inputs';
            clearButton.addEventListener('click', function () {
                clearInputs(key);
            });
            actions.appendChild(clearButton);

            card.appendChild(actions);

            const resultsContainer = document.createElement('div');
            resultsContainer.className = 'results-container';
            card.appendChild(resultsContainer);

            return card;
        }

        // ---------------------------------------------------------------
        // Spec list / selected page
        // ---------------------------------------------------------------

        function patchPageCards() {
            const select = document.getElementById('spec-select');
            const keys = state.specs.map(specKey);
            const prevSelected = select.value;

            select.textContent = '';
            if (keys.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = 'No specs loaded';
                select.appendChild(opt);
            } else {
                for (const key of keys) {
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.textContent = 'spec ' + key;
                    select.appendChild(opt);
                }
            }

            if (keys.length > 0) {
                select.value = keys.indexOf(prevSelected) !== -1 ? prevSelected : keys[0];
            }

            renderSelectedPage();
        }

        function renderSelectedPage() {
            const select = document.getElementById('spec-select');
            const detail = document.getElementById('spec-detail');
            const key = select.value;
            detail.textContent = '';

            if (!key || !state.shows[key]) return;

            const card = buildPageCard(key);
            detail.appendChild(card);
        }

        // ---------------------------------------------------------------
        // Engine interaction
        // ---------------------------------------------------------------

        function fetchShow(key) {
            if (!engine) return null;
            var entry = state.specs.find(function (d) { return specKey(d) === key; });
            if (!entry) return null;
            var repo = entry.repository != null && entry.repository !== '' ? entry.repository : null;
            var name = entry.name;
            var effectiveStr = specEffective(key);
            try {
                var show = engine.show(repo, name, effectiveStr);
                return normalizeShow(show);
            } catch (e) {
                console.error('fetchShow exception for', key, e);
                return null;
            }
        }

        function normalizeShow(show) {
            const data = {};
            if (show.data && typeof show.data === 'object' && !Array.isArray(show.data)) {
                for (const [name, entry] of Object.entries(show.data)) {
                    data[name] = {
                        entryType: entry.type,
                        defaultValue:
                            entry.value != null
                                ? entry.value
                                : entry.suggestion != null
                                  ? entry.suggestion
                                  : null
                    };
                }
            }
            return { spec: show.spec, data: data, rules: show.rules };
        }

        async function loadCode() {
            if (!monacoEditor) return;

            const code = monacoEditor.getValue();

            engine = new Engine();

            try {
                engine.load(code);
            } catch (errs) {
                var loadMsg = Array.isArray(errs) ? errs.join('\n') : String(errs);
                setStatus('err', 'Load failed', loadMsg);
                state.specs = [];
                patchPageCards();
                return;
            }

            let specGroups;
            try {
                specGroups = engine.specs();
            } catch (e) {
                setStatus('err', 'Exception listing specs', e.message || String(e));
                state.specs = [];
                patchPageCards();
                return;
            }

            if (!Array.isArray(specGroups)) {
                console.error('list failed:', specGroups);
                state.specs = [];
                patchPageCards();
                return;
            }
            var specEntries = [];
            for (var gi = 0; gi < specGroups.length; gi++) {
                var g = specGroups[gi];
                var repository = g.repository;
                for (var si = 0; si < g.specs.length; si++) {
                    var lemmaSpec = g.specs[si];
                    specEntries.push(Object.assign({}, lemmaSpec, { repository: repository }));
                }
            }
            const newKeys = specEntries.map(specKey);
            const oldKeys = state.specs.map(specKey);

            for (const oldK of oldKeys) {
                if (newKeys.indexOf(oldK) === -1) {
                    delete state.shows[oldK];
                    delete state.dataValues[oldK];
                    delete state.evalResults[oldK];
                }
            }

            state.specs = specEntries;

            for (const entry of specEntries) {
                const key = specKey(entry);
                try {
                    const repo = entry.repository != null && entry.repository !== '' ? entry.repository : null;
                    const rawShow = engine.show(repo, entry.name, entry.effective_from);
                    state.shows[key] = normalizeShow(rawShow);
                } catch (e) { console.error('show failed for', key, e); }
            }

            patchPageCards();
        }

        function scheduleLoad(immediate) {
            if (!engine || !editorReady) return;
            if (loadTimer !== null) {
                clearTimeout(loadTimer);
                loadTimer = null;
            }
            var delay = immediate ? 0 : 300;
            loadTimer = setTimeout(function () {
                loadTimer = null;
                loadCode();
            }, delay);
        }

        // ---------------------------------------------------------------
        // Evaluate and clear
        // ---------------------------------------------------------------

        async function evaluatePage(key) {
            if (loadTimer !== null) {
                clearTimeout(loadTimer);
                loadTimer = null;
            }
            await loadCode();

            if (!engine) return;

            const entry = state.specs.find(function (d) { return specKey(d) === key; });
            if (!entry) return;
            const name = entry.name;
            const repo = entry.repository != null && entry.repository !== '' ? entry.repository : null;
            const effective = specEffective(key);
            const dataObj = serializeDataValues(key);

            try {
                const response = engine.evaluate(repo, name, null, dataObj, effective);
                state.evalResults[key] = { success: true, response: response };
            } catch (e) {
                state.evalResults[key] = { success: false, error: e.message || String(e) };
                renderResultsForPage(key);
                return;
            }
            renderResultsForPage(key);
        }

        function renderResultsForPage(specName) {
            const detail = document.getElementById('spec-detail');
            const card = detail.querySelector('.spec-card');
            if (!card) return;

            const resultsContainer = card.querySelector('.results-container');
            if (!resultsContainer) return;

            resultsContainer.textContent = '';

            const evalResult = state.evalResults[specName];
            if (!evalResult) return;

            if (!evalResult.success) {
                const errorMessage = document.createElement('div');
                errorMessage.className = 'result-message error';
                errorMessage.textContent = evalResult.error || 'Unknown error';
                resultsContainer.appendChild(errorMessage);
                return;
            }

            const response = evalResult.response;
            if (!response) return;

            const table = buildResultsTable(response);
            if (table) {
                resultsContainer.appendChild(table);
            }
        }

        function clearInputs(specName) {
            state.dataValues[specName] = {};
            persistDataValues(specName);
            delete state.evalResults[specName];

            const detail = document.getElementById('spec-detail');
            const card = detail.querySelector('.spec-card');
            if (!card) return;

            const dataGrid = card.querySelector('.data-grid');
            if (!dataGrid) return;

            const show = state.shows[specName];
            const data =
                show && show.data && typeof show.data === 'object' && !Array.isArray(show.data)
                    ? show.data
                    : {};

            dataGrid.textContent = '';
            for (const [name, entry] of Object.entries(data)) {
                dataGrid.appendChild(buildDataRow(specName, name, entry));
            }

            const resultsContainer = card.querySelector('.results-container');
            if (resultsContainer) {
                resultsContainer.textContent = '';
            }
        }

        // ---------------------------------------------------------------
        // Initialization (fail loudly: every failure shows in status + console)
        // ---------------------------------------------------------------

        function showError(phase, err) {
            const msg = err && (err.message || String(err));
            setStatus('err', phase, msg || 'Unknown error');
            console.error('Lemma playground [' + phase + ']:', msg, err);
        }

        window.addEventListener('unhandledrejection', function (event) {
            showError('Unhandled error', event.reason);
        });

        const engineReady = (async function () {
            try {
                setStatus('warn', 'Initializing…');
                await init();
                engine = new Engine();
                setStatus('warn', 'Loading Monaco…');
            } catch (error) {
                showError('Engine failed to start', error);
                throw error;
            }
        })();

        let editorLoadTimeoutId = null;
        let editorPollId = null;

        function clearEditorLoading() {
            if (editorLoadTimeoutId) { clearTimeout(editorLoadTimeoutId); editorLoadTimeoutId = null; }
            if (editorPollId) { clearInterval(editorPollId); editorPollId = null; }
        }

        async function formatPage(e = null) {
            if (e) e.preventDefault();
            if (!monacoEditor) return;
            await monacoEditor.getAction('editor.action.formatDocument').run();
            scheduleLoad(true);
        }

        async function initEditor(monaco) {
            if (editorReady) return;
            clearEditorLoading();
            try {
                await engineReady;
                registerLemmaLanguage(monaco);

                const editorEl = document.getElementById('editor');
                if (!editorEl) throw new Error('DOM element #editor not found');

                const initialValue = `spec pricing
                            type money: measure
                            -> unit eur: 1
                            -> unit usd: 1.19

                            data price     : [money]
                            data measure  : number -> minimum 0]
                            data is_member : false

                            rule discount:
                            0%
                            unless quantity >= 10 then 10%
                            unless quantity >= 50 then 20%
                            unless is_member then 15%

                            rule subtotal:
                            price * measure

                            rule discount_amount:
                            subtotal * discount

                            rule total:
                            subtotal - discount_amount
                            unless price > 100 usd then veto "This price is too high."
                    `;
                const model = monaco.editor.createModel(initialValue, 'lemma', monaco.Uri.parse(DOC_URI));
                monacoEditor = monaco.editor.create(editorEl, {
                    model: model,
                    language: 'lemma',
                    theme: 'vs',
                    automaticLayout: true,
                    minimap: { enabled: false },
                    scrollBeyondLastLine: false,
                    'semanticHighlighting.enabled': true,
                });

                monacoEditor.onDidChangeModelContent(function () {
                    scheduleLoad(false);
                    if (lspClient) {
                        lspVersion++;
                        lspClient.didChange(DOC_URI, lspVersion, monacoEditor.getValue());
                    }
                });

                document.getElementById('spec-select').addEventListener('change', renderSelectedPage);

                document.getElementById('format-btn').addEventListener('click', formatPage);


                editorReady = true;

                try {
                    lspClient = new LspClient(monaco);
                    await lspClient.start();
                    await lspClient.initialize();

                    lspClient.onDiagnostics(function (uri, diagnostics) {
                        if (!monacoEditor) return;
                        const model = monacoEditor.getModel();
                        if (!model) return;
                        lspClient.setMonacoMarkers(model, diagnostics);

                        if (diagnostics.length === 0) {
                            setStatus('ok', 'Ready');
                        } else {
                            var msgs = diagnostics.map(function (d) { return d.message; });
                            setStatus('err', diagnostics.length + (diagnostics.length === 1 ? ' error' : ' errors'), msgs.join('\n'));
                        }
                    });

                    registerLspProviders(monaco, lspClient);

                    lspVersion = 1;
                    lspClient.didOpen(DOC_URI, 'lemma', lspVersion, monacoEditor.getValue());
                } catch (lspErr) {
                    console.error('LSP init failed:', lspErr);
                }

                setStatus('ok', 'Ready');
                formatPage();
                scheduleLoad(true);
            } catch (err) {
                showError('Editor failed', err);
            }
        }

        editorLoadTimeoutId = setTimeout(function () {
            if (editorReady) return;
            clearEditorLoading();
            showError('Editor load timeout', new Error('Monaco did not appear within 25s.'));
        }, 25000);

        editorPollId = setInterval(function () {
            if (editorReady) return;
            const monaco = self.monaco;
            if (!monaco) return;
            clearEditorLoading();
            initEditor(monaco);
        }, 200);

        const loaderRequire = self.require;
        if (!loaderRequire) {
            clearEditorLoading();
            showError('Loader missing', new Error('Monaco loader (require) not on self. Add script src=".../loader.js" before this script.'));
        } else {
            loaderRequire.config({ paths: { vs: 'vendor/vs' } });
            loaderRequire(
                ['vs/editor/editor.main'],
                function (monacoFromModule) {
                    const monaco = monacoFromModule || self.monaco;
                    if (monaco && !editorReady) {
                        initEditor(monaco);
                    } else if (!editorReady) {
                        clearEditorLoading();
                        showError('Monaco API missing', new Error('vs/editor/editor.main loaded but no API (module export or self.monaco).'));
                    }
                },
                function (err) {
                    clearEditorLoading();
                    showError('Monaco failed to load', err && (err.message || err.requireType || err.requireModules) || err);
                }
            );
        }
    </script>
</body>

</html>

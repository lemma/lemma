[alias]
precommit = "run --package xtask --"
bump = "run -q --package xtask -- versions-bump"
verify = "run -q --package xtask -- versions-verify"
changelog = "run -q --package xtask -- versions-diff"
lsp = "run -q --package xtask -- lsp"
benchmarks = "run -q --package xtask -- benchmarks"
coverage = "run -q --package xtask -- coverage"
fuzzing = "run -q --package xtask -- fuzzing"

[package]
name = "lemma"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lemma_cli"
path = "src/lib.rs"

[[bin]]
name = "lemma"
path = "src/main.rs"

[dependencies]
lemma = { package = "lemma-engine", version = "=0.9.10", path = "../engine" }
lemma-lsp = { version = "=0.9.10", path = "../engine/lsp" }
lemma-openapi = { version = "=0.9.10", path = "../openapi" }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
ariadne = "0.6"
chrono.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
walkdir = "2.4"
ignore = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"] }
super-table = { version = "1.1.1", features = ["custom_styling"] }
inquire = { version = "0.9", features = ["date"] }
rust_decimal.workspace = true

# Server dependencies
axum = "0.8.9"
tower-http = { version = "0.7", features = ["cors"] }
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
notify-debouncer-mini = "0.7"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "http_evaluate"
harness = false

[[bench]]
name = "engine_profile"
harness = false

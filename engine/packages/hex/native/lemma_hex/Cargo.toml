[package]
name = "lemma_hex"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Lemma engine NIF crate for Elixir/Erlang"
publish = false

[lib]
name = "lemma_hex"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
lemma-engine = { path = "../../../../", version = "=0.10.1" }
indexmap = { version = "2.0" }
lemma-openapi = { path = "../../../../../openapi", version = "=0.10.1" }
rustler = { version = "0.38", features = ["big_integer"] }
rust_decimal = "1"
serde_json.workspace = true

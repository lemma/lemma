# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unsound = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "ISC",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    "MIT-0",
    "MPL-2.0",
]
exceptions = []

[bans]
# Transitive stacks often pull two major lines (e.g. tower-lsp vs axum, notify vs rustls). Unifying
# is upstream work; advisories + licenses still apply per crate.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
skip = [
    { crate = "core-foundation@0.9.4", reason = "transitive duplicate, pinned until upstream unifies" },
    { crate = "core-foundation@0.10.1", reason = "transitive duplicate, pinned until upstream unifies" },
    { crate = "hashbrown@0.14.5", reason = "transitive duplicate via dashmap, pinned until upstream unifies" },
    { crate = "hashbrown@0.17.1", reason = "transitive duplicate, pinned until upstream unifies" },
    { crate = "syn@2.0.119", reason = "transitive duplicate, pinned until upstream unifies" },
    { crate = "syn@3.0.6", reason = "transitive duplicate, pinned until upstream unifies" },
    { crate = "thiserror@1.0.69", reason = "transitive duplicate, pinned until upstream unifies" },
    { crate = "thiserror@2.0.21", reason = "transitive duplicate, pinned until upstream unifies" },
    { crate = "thiserror-impl@1.0.69", reason = "transitive duplicate, pinned until upstream unifies" },
    { crate = "thiserror-impl@2.0.21", reason = "transitive duplicate, pinned until upstream unifies" },
    { crate = "windows-sys@0.60.2", reason = "transitive duplicate, pinned until upstream unifies" },
    { crate = "windows-sys@0.61.2", reason = "transitive duplicate, pinned until upstream unifies" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

